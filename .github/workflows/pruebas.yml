# Pasa todas las pruebas (pruebas/todas.sh) en cada cambio propuesto a main y en cada fusión.
# Si algo falla, GitHub lo marca en rojo en la propuesta de cambio antes de fusionarla.
name: Pruebas
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright y Chromium
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Pasar todas las pruebas
        run: bash pruebas/todas.sh
